[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobseekers-mcp"
version = "1.0.0"
description = "MCP server for Jobseekers: LinkedIn job search, visa-sponsorship checks, Gmail and a job-application Google Sheet, gitkb and Discord-bot status, traced in Langfuse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "langfuse>=4.15,<5",
    "python-dotenv>=1.0",
    # imported by the Jobseekers modules the server wraps (linkedin_scraper, visa)
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    # imported by jobtracker (Gmail + Google Sheets)
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jobseekers-mcp = "mcp_server.__main__:main"

[project.urls]
Repository = "https://github.com/steven91007/jobseekers-mcp"
"Jobseekers project" = "https://github.com/steven91007/Jobseekers-"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
